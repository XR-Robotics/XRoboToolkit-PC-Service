name: Build Ubuntu DEB (service only)

# Manual-only trigger. Produces a service-only .deb (no GUI demos) for
# every (distro, arch) combination defined in the build matrix:
#   - ubuntu20.04 / amd64  (glibc 2.31, libstdc++ from gcc-9)
#   - ubuntu20.04 / arm64
#   - ubuntu22.04 / amd64  (glibc 2.35, libstdc++ from gcc-12)
#   - ubuntu22.04 / arm64
# Each job runs entirely inside a matching Ubuntu container so its
# binaries link only against symbols that exist on the target distro.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number suffix; final version is 1.0.0.<build_number>'
        required: false
        default: '0'
      qt_version:
        description: 'Qt 6 version installed via aqtinstall (must support linux_gcc_arm64)'
        required: false
        default: '6.7.3'
      grpc_version:
        description: 'gRPC git tag built from source for arm64 (e.g. v1.66.2)'
        required: false
        default: 'v1.66.2'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.distro }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Ubuntu 20.04 ----------
          - distro: ubuntu20.04
            container_image: 'ubuntu:20.04'
            libc_min: '2.31'
            stdcpp_min: '9'
            arch: amd64
            runner: ubuntu-22.04
            qt_arch: linux_gcc_64
            qt_host: linux
            uname_arch: x86_64
          - distro: ubuntu20.04
            container_image: 'ubuntu:20.04'
            libc_min: '2.31'
            stdcpp_min: '9'
            arch: arm64
            runner: ubuntu-22.04-arm
            qt_arch: linux_gcc_arm64
            qt_host: linux_arm64
            uname_arch: aarch64
          # ---------- Ubuntu 22.04 ----------
          - distro: ubuntu22.04
            container_image: 'ubuntu:22.04'
            libc_min: '2.35'
            stdcpp_min: '12'
            arch: amd64
            runner: ubuntu-22.04
            qt_arch: linux_gcc_64
            qt_host: linux
            uname_arch: x86_64
          - distro: ubuntu22.04
            container_image: 'ubuntu:22.04'
            libc_min: '2.35'
            stdcpp_min: '12'
            arch: arm64
            runner: ubuntu-22.04-arm
            qt_arch: linux_gcc_arm64
            qt_host: linux_arm64
            uname_arch: aarch64

    runs-on: ${{ matrix.runner }}

    container:
      image: ${{ matrix.container_image }}
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: Etc/UTC

    env:
      VERSION: 1.0.0.${{ inputs.build_number }}
      GRPC_INSTALL_DIR: ${{ github.workspace }}/grpc-install
      QT_ROOT: ${{ github.workspace }}/Qt

    steps:
      - name: Install base build tools inside ${{ matrix.distro }}
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          # python3-dev is needed because some aqtinstall transitive
          # deps (notably pyzstd) ship no aarch64 cp38 wheels on
          # Ubuntu 20.04 and fall back to source builds requiring
          # Python.h. Harmless on 22.04 where wheels exist.
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git unzip xz-utils \
            build-essential pkg-config \
            python3 python3-pip python3-venv python3-dev \
            ninja-build \
            libssl-dev zlib1g-dev \
            libdbus-1-dev libfontconfig1-dev libglib2.0-dev \
            libxkbcommon-dev \
            dpkg-dev fakeroot file patchelf
          # Ubuntu 20.04 ships CMake 3.16 which is too old for current
          # gRPC and Qt; 22.04 ships 3.22 which is borderline. Install
          # an up-to-date Kitware CMake binary in both cases for
          # consistency.
          ARCH_FOR_CMAKE='${{ matrix.uname_arch }}'
          curl -fsSL -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v3.27.9/cmake-3.27.9-linux-${ARCH_FOR_CMAKE}.tar.gz"
          mkdir -p /opt/cmake
          tar --strip-components=1 -xzf /tmp/cmake.tar.gz -C /opt/cmake
          ln -sf /opt/cmake/bin/cmake  /usr/local/bin/cmake
          ln -sf /opt/cmake/bin/ctest  /usr/local/bin/ctest
          ln -sf /opt/cmake/bin/cpack  /usr/local/bin/cpack
          cmake --version

      - name: Configure git safe.directory
        shell: bash
        run: |
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install aqtinstall and download Qt6 (${{ inputs.qt_version }} ${{ matrix.qt_arch }})
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv /opt/aqt-venv
          /opt/aqt-venv/bin/pip install --upgrade pip
          /opt/aqt-venv/bin/pip install "aqtinstall>=3.1"
          mkdir -p "$QT_ROOT"
          /opt/aqt-venv/bin/aqt install-qt \
            ${{ matrix.qt_host }} desktop ${{ inputs.qt_version }} ${{ matrix.qt_arch }} \
            --outputdir "$QT_ROOT" \
            --modules qt5compat
          # Resolve the actual install prefix (e.g. $QT_ROOT/6.7.3/gcc_64).
          # `head -n1` may close the pipe while `find` is still writing,
          # which would otherwise cause SIGPIPE / exit 141 under
          # pipefail; the trailing `|| true` swallows that.
          QT_PREFIX="$(find "$QT_ROOT/${{ inputs.qt_version }}" -maxdepth 1 -mindepth 1 -type d | head -n1 || true)"
          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "Resolved Qt prefix: $QT_PREFIX"
          ls -la "$QT_PREFIX/lib" | head -20 || true

      # ---------------------------------------------------------------
      # arm64 path: the repo intentionally ships no prebuilt gRPC static
      # libraries for aarch64 (see Redistributable/linux_aarch64/grpc/
      # notice.txt). We build it from source and cache the install dir.
      # amd64 reuses the prebuilt set already in
      # Redistributable/linux/grpc/lib.
      # The cache key includes the distro so 20.04 and 22.04 builds
      # never share gRPC binaries with different glibc requirements.
      # ---------------------------------------------------------------
      - name: Cache gRPC install (arm64 only)
        if: matrix.arch == 'arm64'
        id: cache-grpc
        uses: actions/cache@v4
        with:
          path: ${{ env.GRPC_INSTALL_DIR }}
          key: grpc-${{ matrix.distro }}-${{ matrix.arch }}-${{ inputs.grpc_version }}-${{ hashFiles('scripts/ci/build-grpc.sh') }}

      - name: Build gRPC from source (arm64, cache miss)
        if: matrix.arch == 'arm64' && steps.cache-grpc.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/ci/build-grpc.sh
          JOBS=$(nproc) scripts/ci/build-grpc.sh "${{ inputs.grpc_version }}" "$GRPC_INSTALL_DIR"

      - name: Stage gRPC into RoboticsService/Redistributable (arm64)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euxo pipefail
          DEST="$GITHUB_WORKSPACE/RoboticsService/Redistributable/linux_aarch64/grpc"
          mkdir -p "$DEST/lib" "$DEST/include"
          cp -a "$GRPC_INSTALL_DIR/lib/."     "$DEST/lib/"
          cp -a "$GRPC_INSTALL_DIR/include/." "$DEST/include/"
          echo "Static libraries staged:"
          ls "$DEST/lib" | head -20 || true

      # ---------------------------------------------------------------
      # Build RoboticsService
      # ---------------------------------------------------------------
      - name: Build RoboticsService (Release)
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/ci/build-roboticsservice.sh
          JOBS=$(nproc) scripts/ci/build-roboticsservice.sh \
            "$QT_PREFIX" "${{ inputs.build_number }}"

      # ---------------------------------------------------------------
      # Build client SDK (PXREARobotSDK)
      # PXREARobotSDK is a standalone shared library used by 3rd-party
      # apps to talk to RoboticsServiceProcess via gRPC. Its CMake
      # project is separate from the main RoboticsService one and is
      # built here so the .so and its header can be bundled into the
      # final .deb.
      # ---------------------------------------------------------------
      - name: Build PXREARobotSDK (Release)
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/ci/build-pxrearobotsdk.sh
          JOBS=$(nproc) scripts/ci/build-pxrearobotsdk.sh \
            "${{ inputs.build_number }}"

      # ---------------------------------------------------------------
      # Package as .deb (service only, no GUI / no demos).
      # LIBC_MIN / STDCPP_MIN are stamped into Depends so apt will
      # refuse to install a binary on hosts with too-old runtimes.
      # ---------------------------------------------------------------
      - name: Build service-only .deb
        shell: bash
        env:
          LIBC_MIN: ${{ matrix.libc_min }}
          STDCPP_MIN: ${{ matrix.stdcpp_min }}
        run: |
          set -euxo pipefail
          chmod +x RoboticsService/Package/debPackServiceOnly/*.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          RoboticsService/Package/debPackServiceOnly/build-deb.sh \
            "${{ matrix.arch }}" \
            "$VERSION" \
            "$GITHUB_WORKSPACE/RoboticsService/bin" \
            "$QT_PREFIX" \
            "$GITHUB_WORKSPACE/dist" \
            "${{ matrix.distro }}"

      - name: Inspect produced package
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh "$GITHUB_WORKSPACE/dist"
          dpkg-deb -I "$GITHUB_WORKSPACE/dist"/xrobotoolkit-pc-service_*.deb
          echo "--- contents ---"
          dpkg-deb -c "$GITHUB_WORKSPACE/dist"/xrobotoolkit-pc-service_*.deb | head -40 || true

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: xrobotoolkit-pc-service-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/xrobotoolkit-pc-service_*.deb
          if-no-files-found: error
          retention-days: 30
